{% extends 'base.html' %}{% block body %}<h1>Welcome, {{session.name}}</h1><div class="grid"><section class="card"><h2>{{projects|length}} Projects</h2><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><input name="title" placeholder="Project name" required><button>Create project</button></form>{% for p in projects %}<p>{{p.title}}</p>{% endfor %}</section><section class="card"><h2>Create documentation</h2><form method="post" action="/documents"><input type="hidden" name="csrf" value="{{session.csrf}}"><select name="project" required>{% for p in projects %}<option value="{{p.id}}">{{p.title}}</option>{% endfor %}</select><input name="title" placeholder="Document title" required><button>Create document</button></form></section></div><section class="card"><h2>Documents</h2><form><input name="q" placeholder="Search documents"><button>Search</button></form>{% for d in docs %}<p><a href="/documents/{{d.id}}">{{d.title}}</a></p>{% endfor %}</section>{% endblock %}
