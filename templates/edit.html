{% extends 'base.html' %}{% block body %}<h1>{{doc.title}}</h1><section class="card"><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><textarea name="content" rows="18">{{doc.content}}</textarea><button>Save version</button></form></section><section class="card"><h2>Version history</h2>{% for v in versions %}<form method="post" action="/documents/{{doc.id}}/restore/{{v.id}}"><input type="hidden" name="csrf" value="{{session.csrf}}"><p>Revision {{v.id}} · {{v.created_at}}</p><details><summary>View content</summary><pre>{{v.content}}</pre></details><button>Restore</button></form>{% endfor %}</section>{% endblock %}
