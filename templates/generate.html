{% extends 'base.html' %}{% block body %}<h1>Documentation Generator</h1><div class="grid"><section class="card"><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><label>Mode</label><select name="mode"><option value="function">Function documentation</option><option value="diff" {% if mode=='diff' %}selected{% endif %}>Code diff</option></select><label>Previous code (for diff)</label><textarea name="old" rows="6">{{old}}</textarea><label>Source code</label><textarea name="source" rows="12" required>{{source}}</textarea><button>Generate documentation</button></form></section><section class="card"><h2>Generated output</h2><pre>{{result}}</pre></section></div>{% endblock %}
